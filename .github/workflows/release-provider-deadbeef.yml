name: Release DeaDBeeF plugin

# Triggered by pushing a tag such as "provider-deadbeef/v1.0.0".
# Builds the MMCP provider plugin from provider-deadbeef/ for the supported
# platforms and attaches the packaged artifacts to a GitHub Release.

on:
  push:
    tags:
      - "provider-deadbeef/v*"

permissions:
  contents: write

env:
  DDB_REPO: https://github.com/DeaDBeeF-Player/deadbeef.git
  # Build against a released API version, not master: the plugin API is
  # append-only, so artifacts work on this release and any newer player.
  DDB_REF: "1.10.3"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            cc: cc
            plugin: mmcp.so
            ldflags: "-shared"
          - platform: windows-x86_64
            cc: x86_64-w64-mingw32-gcc
            plugin: mmcp.dll
            ldflags: "-shared -static-libgcc -lws2_32"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          fi

      - name: Fetch DeaDBeeF headers
        run: git clone --depth 1 --branch "$DDB_REF" "$DDB_REPO" deadbeef

      - name: Build
        working-directory: provider-deadbeef
        run: |
          make clean
          make \
            CC='${{ matrix.cc }}' \
            PLUGIN='${{ matrix.plugin }}' \
            DDB_INCLUDE='-I'"$GITHUB_WORKSPACE"'/deadbeef/include' \
            LDFLAGS='${{ matrix.ldflags }}'
          test -f '${{ matrix.plugin }}'

      - name: Package
        working-directory: provider-deadbeef
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          VERSION="${GITHUB_REF_NAME#provider-deadbeef/v}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "${{ matrix.plugin }}" "$GITHUB_WORKSPACE/dist/"
          cp README.md LICENSE "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && python3 -m zipfile -c \
            "mmcp-deadbeef-${VERSION}-${PLATFORM}.zip" \
            "${{ matrix.plugin }}" README.md LICENSE)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmcp-deadbeef-${{ matrix.platform }}
          path: dist/mmcp-deadbeef-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
